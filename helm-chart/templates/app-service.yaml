apiVersion: v1
kind: Service
metadata:
  name: {{ include "devops-php-todo.fullname" . }}
  labels:
    {{- include "devops-php-todo.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "devops-php-todo.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP

      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}