apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "devops-php-todo.fullname" . }}
  labels:
    {{- include "devops-php-todo.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "devops-php-todo.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "devops-php-todo.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: php-todo
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          env:
            # MySQL configuration
            - name: DB_HOST
              value: "mysql"

            - name: MYSQL_DATABASE
              value: {{ .Values.mysql.database | quote }}

            - name: MYSQL_USER
              value: {{ .Values.mysql.user | quote }}

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: todo-mysql-secret
                  key: MYSQL_PASSWORD

            # Redis configuration
            - name: REDIS_HOST
              value: "redis"

            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}